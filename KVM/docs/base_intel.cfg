# Maximum seconds allowed for QEMU startup and monitor creation.
vm_create_timeout = 130
# Maximum seconds allowed for the guest to obtain an IP and accept a login.
login_timeout = 240
# Restrict generated configurations to OVMF firmware variants.
only ovmf
# Disable the host page cache for guest disk I/O.
drive_cache = none
# Run guests against temporary snapshots instead of modifying base images.
image_snapshot = yes

# Host bridge or network destination used by guest NICs.
# Uncomment to use the host network destination named "switch".
# netdst = switch
# Attach guest NICs to the host's default libvirt bridge.
netdst = virbr0

# Number of virtual CPUs initially assigned to each guest.
smp = 4
# Select the QEMU backend for VM creation and management.
vm_type = qemu
# Disable automatic CPU model selection.
auto_cpu_model = "no"
# Expose the host CPU model to guests.
cpu_model = host

# Uncomment and list host PCI BDFs to prepare for device passthrough.
# setup_hostdev_slots = 0000:11:00.1
# Uncomment to verify passthrough devices through the guest serial console.
# hostdev_verify_mode = serial
# Uncomment and set a reachable address used by guest network ping checks.
# ext_host = 192.168.96.1

# Do not enable or tune Kernel Same-page Merging during test setup.
setup_ksm = no
# Destroy guest VMs during test postprocessing.
kill_vm = yes
