- td_debug:
    virt_test_type = qemu
    type = td_debug
    vm_accelerator = kvm
    machine_type_extra_params = "kernel-irqchip=split"
    vm_secure_guest_type = tdx
    start_vm = yes
    kill_vm = yes
    # Default value for centos image, you can overwrite it in runtime cfg for other OS image.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    vga = std
    auto_cpu_model = "no"
    cpu_model = host
    variants:
        - nmi:
            nmi = "yes"
        - idle:
            no default
            nmi = "no"
    variants:
        - default:
        - debugon:
            vm_secure_guest_object_options = debug=on
        - debugoff:
            vm_secure_guest_object_options = debug=off
