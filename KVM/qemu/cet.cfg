- cet:
    type = cet
    login_timeout = 360
    kill_vm_on_error = yes
    # Default value for centos image, you can overwrite it in runtime cfg for other OS image.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    start_vm = no
    vga = std
    only i386, x86_64
    test_dir = '/home'
    source_file = 'cpuid_check.c'
    exec_file = 'cpuid_check'
    cpuid_src_subdir = "tools/cpuid_check"
    auto_cpu_model = "no"
    cpu_model = host
    cet_flags = "user_shstk ibt"
    variants:
        - cet_basic:
            # CET SHSTK and IBT should be exposed to guest by default
            cet_test_type = "exposed"
            check_host_cpuid = yes
            host_cpuid = "7 0 0 0 c 7, 7 0 0 0 d 20"
            guest_cpuid = "7 0 0 0 c 7, 7 0 0 0 d 20"
            guest_only_cpuid = "7 0 1 0 d 18:18 0"
        - cet_xsave_check:
            # CET bits in XSAVES state should be enabled on guest
            cet_test_type = "xsave"
            check_host_cpuid = yes
            host_cpuid = "d 0 1 0 c 11, d 0 b 0 c 0"
            guest_cpuid = "d 0 1 0 c 11, d 0 b 0 c 0"
            xss_msr = "0xda0"
            xss_msr_bitfield = "11:11"
        - cet_vm_disable:
            # SHSTK and IBT unexposed to guest when disabled on guest cmdline
            cet_test_type = "unexposed"
            disable_method = "guest_cmdline"
            no_flags = "user_shstk ibt"
        - cet_host_disable:
            # SHSTK and IBT unexposed to guest when disabled on host
            # Host kernel cmdline must include "ibt=off clearcpuid=519".
            cet_test_type = "unexposed"
            disable_method = "host"
            no_flags = "user_shstk ibt"
        - cet_qemu_disable:
            # SHSTK and IBT unexposed to guest when disabled on qemu cmd
            cet_test_type = "unexposed"
            disable_method = "qemu"
            cpu_model_flags = ",-cet-ss,-cet-ibt"
            no_flags = "user_shstk ibt"
    variants:
        - vm:
        - tdvm:
            machine_type_extra_params = "kernel-irqchip=split"
            vm_secure_guest_type = tdx
