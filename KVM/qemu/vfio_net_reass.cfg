- vfio_net_reass:
    virt_test_type = qemu
    type = vfio_net_boot
    login_timeout = 360
    start_vm = no
    # Serial autologin on bash 5.1+ images emits bracketed-paste escapes before
    # the prompt; the default anchored regex never matches. Override in the
    # runtime cfg at a scope that wins over guest-os.cfg (e.g. inside the
    # run variant).
    shell_prompt = "^\[.*\][\#\$]\s*$"
    # Keep nics empty so the guest only has the passthrough VFs as NICs;
    # ssh_login_from_mac() matches the VF MAC without hitting a bridge NIC.
    nics = ""
    # Host PCI slot of the target PF (e.g. 0000:b8:00.1). Must be supplied
    # by the runtime cfg; there is no meaningful default here.
    # setup_hostdev_slots = 0000:00:00.1
    hostdev_bind_driver = vfio-pci
    vm_hostdev_driver = vfio-pci
    hostdev_assignment_type = vf
    # SR-IOV VF pool size to create on the PF; 4 comfortably covers a 2-VF
    # assignment with headroom, and matches the vfio_net_ops default.
    hostdev_vf_counts = 4
    # Ping target reachable from the VF subnet. Isolated lab subnets have no
    # external routing; override in the runtime cfg to a reachable host
    # (e.g. the subnet gateway).
    ext_host = kernel.org
    vms = "vm1"
    # Every reass variant assigns two VFs to the same guest.
    vm_hostdevs = "hostdev1 hostdev2"
    dma_cmd = "echo 0x200000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit"
    variants:
        - reass_reboot:
            # Boot the guest once with two VFs, reboot the guest OS
            # reass_iterations times, and verify the VF interfaces still
            # work after every reboot. Default 10 matches the legacy loop.
            hostdev_action = reass_reboot
            reass_iterations = 10
        - reass_shutdown:
            # Loop reass_iterations times: create the guest with two VFs,
            # verify the VFs, ask the guest OS to power itself off, then
            # tear the QEMU process down. Default 20 matches the legacy loop.
            hostdev_action = reass_shutdown
            reass_iterations = 20
        - reass_destroy:
            # Loop reass_iterations times: create the guest with two VFs,
            # verify the VFs, then destroy the QEMU process directly from
            # the host without an in-guest shutdown. Default 20 matches
            # the legacy loop.
            hostdev_action = reass_destroy
            reass_iterations = 20
    variants ip_version:
        - ipv4:
    variants:
        # Guest type dimension. Only the standard VM variant is exercised here;
        # a tdvm branch can be added later on a TDX-capable host with the
        # usual TDX cfg (vm_secure_guest_type = tdx,
        # machine_type_extra_params = "kernel-irqchip=split", pinned cpu_model).
        - vm:
