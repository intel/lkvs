- vtd_pcie_reass:
    virt_test_type = qemu
    type = vfio_net_boot
    start_vm = no
    shell_prompt = "^\[.*\][\#\$]\s*$"
    nics = ""
    # setup_hostdev_slots = 0000:00:00.1
    hostdev_bind_driver = vfio-pci
    vm_hostdev_driver = vfio-pci
    # PF passthrough of a whole NIC; the
    # target slot must be provided via setup_hostdev_slots in the runtime
    # cfg. No SR-IOV VFs are created for these cases.
    hostdev_assignment_type = pf
    # Verify through the serial console only: the guest has no management
    # NIC (nics=""), so host-to-guest SSH is not reachable. See the
    # matching note in vtd_pcie_ops.cfg for the rationale.
    hostdev_verify_mode = serial
    ext_host = kernel.org
    vms = "vm1"
    vm_hostdevs = hostdev1
    variants ip_version:
        - ipv4:
    variants:
        - one_pcie_reass_reboot:
            hostdev_action = reass_reboot
            reass_iterations = 10
            smp = 1
            vcpu_maxcpus = 1
        - one_pcie_reass_shutdown:
            hostdev_action = reass_shutdown
            reass_iterations = 20
            smp = 4
            vcpu_maxcpus = 4
        - one_pcie_reass_destroy:
            hostdev_action = reass_destroy
            reass_iterations = 20
