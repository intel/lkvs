- vfio_net_viommu:
    virt_test_type = qemu
    type = vfio_net_boot
    start_vm = no
    # Serial autologin on bash 5.1+ images emits bracketed-paste escapes at the
    # start of the last non-empty line before the prompt; the ^ anchor in the
    # default shell_prompt would never match. Setting a relaxed value here has
    # no effect because the guest-os cfg (loaded later) overrides it. Override
    # in the runtime cfg at a scope that wins, e.g. inside your run variant:
    #     shell_prompt = "\[.*\][\#\$]\s*$"
    shell_prompt = "^\[.*\][\#\$]\s*$"
    vms = "vm1"
    variants ip_version:
        - ipv4:
    variants viommu:
        - legacy:
            viommu_mode = legacy
        - scalable:
            viommu_mode = scalable
    variants:
        # Bridge virtio-net NIC only (no assigned device), pinged from the host.
        - vnet:
            viommu_net_check = bridge
            # Only legacy can drop caching-mode; scalable always keeps it.
            legacy:
                viommu_caching_mode = no
        # SR-IOV VF passthrough NIC, verified over the serial console.
        - nic_vf:
            # Keep nics empty: the guest must have ONLY the passthrough VF as
            # its network interface so that verification picks the VF NIC when
            # matching by MAC. Adding a default NIC here would cause MAC lookup
            # to hit the wrong interface and DHCP races between the two networks.
            nics = ""
            # Host PCI slot of the target PF, e.g. 0000:b8:00.1. Find yours with
            # `lspci -D | grep -i ethernet` and confirm SR-IOV support via
            # `cat /sys/bus/pci/devices/<slot>/sriov_totalvfs`. The slot must be
            # provided in the runtime cfg; there is no meaningful default.
            # setup_hostdev_slots = 0000:00:00.1
            hostdev_bind_driver = vfio-pci
            vm_hostdev_driver = vfio-pci
            hostdev_assignment_type = vf
            hostdev_vf_counts = 1
            vm_hostdev_iommufd = iommufd0
            # The guest owns just the passthrough VF and its usable IOMMU mode
            # changes per case, so a host-guest IP path is not assumed.
            hostdev_verify_mode = serial
            hostdev_action = boot
            # Ping target reachable from the VF subnet. Isolated lab subnets
            # have no external routing; override in runtime cfg with the subnet
            # gateway or another host on the same segment (e.g. 192.168.0.1).
            ext_host = kernel.org
            vm_hostdevs = hostdev1
            # Guest IOMMU driver mode.
            variants:
                - giommu_off:
                    guest_iommu_cmdline = intel_iommu=off
                # Guest IOMMU driver in legacy translation; gIOVA is shadowed.
                - shadow_giova:
                    legacy:
                        guest_iommu_cmdline = intel_iommu=on
                    scalable:
                        guest_iommu_cmdline = intel_iommu=on,sm_off
                # Split irqchip lets the legacy vIOMMU remap VF interrupts.
                - vintr:
                    only legacy
                    machine_type_extra_params = "kernel-irqchip=split"
                    guest_iommu_cmdline = intel_iommu=on
                # Guest IOMMU driver in scalable-mode (nested) translation.
                - nested_giova:
                    only scalable
                    guest_iommu_cmdline = intel_iommu=on,sm_on
