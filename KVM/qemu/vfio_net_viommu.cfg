- vfio_net_viommu:
    virt_test_type = qemu
    type = vfio_net_boot
    start_vm = no
    # Serial autologin on bash 5.1+ images emits bracketed-paste escapes at the
    # start of the last non-empty line before the prompt; the ^ anchor in the
    # default shell_prompt would never match. Setting a relaxed value here has
    # no effect because the guest-os cfg (loaded later) overrides it. Override
    # in the runtime cfg at a scope that wins, e.g. inside your run variant:
    #     shell_prompt = "\[.*\][\#\$]\s*$"
    shell_prompt = "^\[.*\][\#\$]\s*$"
    # Keep nics empty: the guest must have ONLY the passthrough VF as its
    # network interface so that verification picks the VF NIC when matching
    # by MAC. Adding a default NIC here would cause MAC lookup to hit the
    # wrong interface and DHCP races between the two networks.
    nics = ""
    # Host PCI slot of the target PF, e.g. 0000:b8:00.1. Find yours with
    # `lspci -D | grep -i ethernet` and confirm SR-IOV support via
    # `cat /sys/bus/pci/devices/<slot>/sriov_totalvfs`. The slot must be
    # provided in the runtime cfg; there is no meaningful default.
    # setup_hostdev_slots = 0000:00:00.1
    hostdev_bind_driver = vfio-pci
    vm_hostdev_driver = vfio-pci
    hostdev_assignment_type = vf
    hostdev_vf_counts = 1
    # Back the VF passthrough with an iommufd object, matching the legacy
    # `-object iommufd,id=iommufd0 ... iommufd=iommufd0` device wiring.
    vm_hostdev_iommufd = iommufd0
    # Drive verification through the serial console only: the guest owns just
    # the passthrough VF, and its usable IOMMU mode changes per case, so a
    # host-guest IP path is not assumed.
    hostdev_verify_mode = serial
    hostdev_action = boot
    # Ping target reachable from the VF subnet. Isolated lab subnets have no
    # external routing; override in runtime cfg with the subnet gateway or
    # another host on the same segment (e.g. ext_host = 192.168.0.1).
    ext_host = kernel.org
    vms = "vm1"
    vm_hostdevs = hostdev1
    variants ip_version:
        - ipv4:
    variants:
        - nic_vf_leg:
            # Legacy-mode guest vIOMMU, guest IOMMU driver disabled.
            viommu_mode = legacy
            guest_iommu_cmdline = intel_iommu=off
        - nic_vf_leg_giova:
            # Legacy-mode guest vIOMMU with the guest IOMMU driver enabled
            # (gIOVA mappings).
            viommu_mode = legacy
            guest_iommu_cmdline = intel_iommu=on
        - nic_vf_leg_vintr:
            # Legacy-mode guest vIOMMU with virtual interrupt remapping; the
            # split irqchip lets the vIOMMU deliver remapped VF interrupts.
            viommu_mode = legacy
            machine_type_extra_params = "kernel-irqchip=split"
            guest_iommu_cmdline = intel_iommu=on
        - nic_vf_sca:
            # Scalable-mode guest vIOMMU, guest IOMMU driver disabled.
            viommu_mode = scalable
            guest_iommu_cmdline = intel_iommu=off
        - nic_vf_sca_shadow_giova:
            # Scalable-mode guest vIOMMU with shadow gIOVA: the guest IOMMU
            # driver runs in legacy (scalable-mode off) translation.
            viommu_mode = scalable
            guest_iommu_cmdline = intel_iommu=on,sm_off
        - nic_vf_sca_nested_giova:
            # Scalable-mode guest vIOMMU with nested gIOVA: the guest IOMMU
            # driver runs in scalable-mode (nested) translation.
            viommu_mode = scalable
            guest_iommu_cmdline = intel_iommu=on,sm_on
