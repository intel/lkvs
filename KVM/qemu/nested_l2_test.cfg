- nested_l2_test:
    type = nested_l2_test
    virt_test_type = qemu
    vm_accelerator = kvm
    start_vm = no
    kill_vm = yes
    shell_prompt = "^\[.*\][\#\$]\s*$"
    # Enable nested KVM on the host before booting L1. Runs in
    # env_process.preprocess (host shell). If nested is already on,
    # leave it untouched; otherwise reload kvm_intel with nested=1 and
    # drop a marker so post_command can restore it. Fails the test
    # (test error) if nested cannot be enabled.
    pre_command = "if grep -qxE 'Y|1' /sys/module/kvm_intel/parameters/nested; then rm -f /tmp/.nested_kvm_toggled_by_case; else modprobe -r kvm_intel 2>/dev/null; modprobe kvm_intel nested=1; touch /tmp/.nested_kvm_toggled_by_case; fi; grep -qxE 'Y|1' /sys/module/kvm_intel/parameters/nested"
    # Restore the host after the case: only disable nested again if this
    # case was the one that enabled it (marker present).
    post_command = "if [ -f /tmp/.nested_kvm_toggled_by_case ]; then modprobe -r kvm_intel 2>/dev/null; modprobe kvm_intel nested=0 2>/dev/null; rm -f /tmp/.nested_kvm_toggled_by_case; fi; true"
    vga = std
    smp = 8
    mem = 8192
    cpu_model_flags += ",+vmx"
    # L2 QEMU (nested) inside L1
    l2_mem = 2048
    l2_smp = 2
    l2_ssh_port = 2222
    l2_boot_timeout = 180
    # L2 image is a raw copy of L1 image, placed in the same host
    # directory as L1. It is attached to L1 as image2 (virtio-blk),
    # appearing inside L1 as /dev/vdb, and used directly by nested QEMU.
    l2_image_basename = "l2_guest"
    variants:
        - pku:
            l2_test_type = "pku"
            cpu_model_flags += ",+pku"
        - vpmu:
            l2_test_type = "vpmu"
            cpu_model_flags += ",pmu=on"
            l2_cpu_flags = "pmu=on"
