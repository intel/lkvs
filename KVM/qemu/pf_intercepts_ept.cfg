- pf_intercepts_ept:
    type = pf_intercepts_ept
    only Linux
    virt_test_type = qemu
    vm_accelerator = kvm
    # Handler boots the guest itself so it can install the host tracepoint
    # before the VM starts running.
    start_vm = no
    kill_vm = yes
    # Default shell prompt for the centos image; override in runtime cfg for
    # other guest OS images.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    auto_cpu_model = "no"
    cpu_model = host
    vga = std
    login_timeout = 240
    # Host EPT-enabled sysfs knob (Intel VMX).
    ept_sysfs = /sys/module/kvm_intel/parameters/ept
    # Time window (seconds) to observe guest kvm_exit events after boot.
    trace_duration = 10
    # Intel VMX intr_info low 8 bits carry the vector; page fault is vector 14.
    pf_vector = 14
