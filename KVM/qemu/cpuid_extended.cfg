- cpuid_extended:
    type = cpuid_extended
    virt_test_type = qemu
    vm_accelerator = kvm
    force_create_image = no
    remove_image = no
    image_snapshot = yes
    start_vm = no
    kill_vm = yes
    shell_prompt = "^\[.*\][\#\$]\s*$"
    vga = std
    auto_cpu_model = no
    cpu_model = host
    variants:
        - leaf_80000005:
            cpuid_leaf = "0x80000005"
            expected_eax = 0
            expected_ebx = 0
            expected_ecx = 0
            expected_edx = 0
        - leaf_80000006:
            cpuid_leaf = "0x80000006"
            expected_eax = 0
            expected_ebx = 0
            expected_ecx = 0
            expected_edx = 0
