- vfio_net_ops:
    virt_test_type = qemu
    type = vfio_net_boot
    start_vm = no
    # Serial autologin on bash 5.1+ images emits bracketed-paste escapes at the
    # start of the last non-empty line before the prompt; the ^ anchor in the
    # default shell_prompt would never match. Setting a relaxed value here has
    # no effect because the guest-os cfg (loaded later) overrides it. Override
    # in the runtime cfg at a scope that wins, e.g. inside your run variant:
    #     shell_prompt = "\[.*\][\#\$]\s*$"
    shell_prompt = "^\[.*\][\#\$]\s*$"
    # Keep nics empty: the guest must have ONLY the passthrough hostdev(s) as
    # its network interface(s) so that ssh_login_from_mac() picks the VF NIC
    # when matching by MAC. Adding a default NIC here would cause MAC lookup
    # to hit the wrong interface and DHCP races between the two networks.
    nics = ""
    # Host PCI slot of the target PF, e.g. 0000:b8:00.1. Find yours with
    # `lspci -D | grep -i ethernet` and confirm SR-IOV support via
    # `cat /sys/bus/pci/devices/<slot>/sriov_totalvfs`. The slot must be
    # provided in the runtime cfg; there is no meaningful default.
    # setup_hostdev_slots = 0000:00:00.1
    hostdev_bind_driver = vfio-pci
    vm_hostdev_driver = vfio-pci
    hostdev_assignment_type = vf
    # SR-IOV VF pool size to create on the PF. Default covers the two-VF cases;
    # override in runtime cfg if the PF supports fewer VFs.
    hostdev_vf_counts = 4
    # Ping target reachable from the VF subnet. Isolated lab subnets have no
    # external routing; override in runtime cfg with the subnet gateway or
    # another host on the same segment (e.g. ext_host = 192.168.0.1).
    ext_host = kernel.org
    vms = "vm1"
    dma_cmd = "echo 0x200000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit"
    variants:
        - 1vf:
            vm_hostdevs = hostdev1
        - 2vfs:
            vm_hostdevs = "hostdev1 hostdev2"
        - many_vms:
            # Boot multiple guests concurrently, each owning exactly one
            # VF, exercising the "one VF per guest" scale-out topology.
            # Extra guests are spawned via avocado-vt's vms mechanism;
            # each vm namespace inherits a single hostdev definition and
            # the handler assigns one VF slot per guest from the shared
            # pool. Actions that require single-VM semantics (hotswap
            # family, live_migration) are excluded. TDX guests are also
            # excluded because multiplying TDX memory footprint by N is
            # out of scope for this handler.
            no hotswap
            no hotswap_3times
            no serial_hotswap
            no live_migration
            no scp
            no tdvm
            vms = "vm1 vm2"
            vm_hostdevs = hostdev1
            # Concurrent guests must not scribble on the shared base image;
            # QCOW snapshots isolate each vm's writes.
            image_snapshot = yes
        - serial_vfs:
            # Handler loops once per available VF, booting a single-hostdev
            # guest each iteration; the iteration count comes from the number
            # of VFs actually created (hostdev_vf_counts).
            vm_hostdevs = hostdev1
            hostdev_serial_vfs = yes
        - max_vfs:
            # Assign the NIC's full SR-IOV capacity to a single guest. The VF
            # count is discovered at runtime from the PF's sriov_totalvfs (the
            # "Total VFs" field of `lspci -vvv`), so the same case adapts to
            # whatever card is under test. The handler builds the hostdev list
            # and the required pci bridges dynamically; no static vm_hostdevs
            # is needed. Hotswap flows require exactly one hostdev and exclude
            # this topology in their own variant definitions.
            hostdev_vf_counts = max
            hostdev_max_vfs = yes
            # Optional cap on how many of the discovered VFs to assign; 0 (or
            # unset) assigns them all. Slots per bridge default to 31 and the
            # bridge type is auto-selected (pcie-pci-bridge on q35, pci-bridge
            # on pc); override hostdev_vf_slots_per_bridge / hostdev_vf_bridge_type
            # if needed.
            hostdev_max_assign = 0
            # 64 VFs racing DHCP concurrently need a longer settle window
            # than the single-VF default of 90s. The dominant cost is the
            # per-VF NM auto-activation + DHCP transaction plus back-off,
            # not any specific VF being slow, so pick a value that covers
            # the tail of a normal 64-lease burst on a healthy pool.
            vf_ip_wait_timeout = 180
            mem = 16384
            smp = 8
            vcpu_maxcpus = 8
            # TDX guests need vfio_iommu_type1 DMA mappings for every 4 KiB of
            # guest RAM per VF (16 GiB * 64 VFs / 4 KiB = 256M mappings). Raise
            # the kernel default well above that; the handler only applies
            # dma_cmd on the tdvm branch.
            dma_cmd = "echo 0x10000000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit"
    variants:
        - boot:
            hostdev_action = boot
        - scp:
            hostdev_action = scp
            # Sparse test file size in MiB; matches the legacy 100MiB payload
            # used by the SCP validation.
            scp_file_size_mb = 100
        - hotswap:
            # Iterative hot-unplug/hot-plug of a single VF, mirroring the
            # NIC hot plug reassignment scenario. Handler requires exactly
            # one hostdev, so exclude the multi-VF topologies.
            no 2vfs
            no serial_vfs
            no max_vfs
            hostdev_action = hotswap
            hotplug_iterations = 2
        - hotswap_3times:
            # Three-iteration hotplug/unplug of one VF against a UP guest;
            # tdvm branch inherits smp=4 from the guest-type variant.
            no 2vfs
            no serial_vfs
            no max_vfs
            hostdev_action = hotswap
            hotplug_iterations = 3
            smp = 1
            vcpu_maxcpus = 1
        - serial_hotswap:
            # Successive per-VF hotplug: for each VF exposed by the PF,
            # boot a single-hostdev guest with the VF cold-plugged, then
            # exercise the hotplug/unplug cycle. Requires the serial_vfs
            # topology.
            no 1vf
            no 2vfs
            no max_vfs
            hostdev_action = hotswap
            hotplug_iterations = 2
        - live_migration:
            # Local live migration of a KVM guest that owns SR-IOV VF(s).
            # PCI passthrough blocks migration, so the handler hot-unplugs
            # every assigned VF before triggering vm.migrate() and confirms
            # the guest survives via the serial console on the destination.
            # Only 1vf and serial_vfs topologies are exercised; 2vfs and
            # max_vfs are excluded. TDX guests need migtd for migration
            # and are excluded from this action.
            no 2vfs
            no max_vfs
            no tdvm
            hostdev_action = live_migration
            mig_protocol = tcp
            mig_timeout = 300
        - vtd_ir_qi:
            # VT-d Interrupt Remapping + Queued Invalidation validation:
            # precheck the host kernel log for both IR and QI, then boot
            # a 4-vCPU SMP guest with a single VF assigned and prove the
            # VF interrupt path is functional via a ping. Only the 1vf
            # topology makes sense (test targets one VF's interrupt path).
            no 2vfs
            no serial_vfs
            no max_vfs
            no many_vms
            hostdev_action = vtd_ir_qi
            smp = 4
            vcpu_maxcpus = 4
    variants ip_version:
        - ipv4:
    variants:
        # Guest type dimension. "vm" is the standard KVM guest; "tdvm" is
        # the TDX confidential guest, matching XVS tdx_one_vf_smp /
        # tdx_two_vfs_smp / tdx_serial_vfs_smp (SMP TD guest with 1 / 2 /
        # serial VF assignment).
        - vm:
        - tdvm:
            machine_type_extra_params = "kernel-irqchip=split"
            vm_secure_guest_type = tdx
            auto_cpu_model = "no"
            cpu_model = host
            # XVS TDX cases run with cpu=4; keep parity so the leaf
            # geometry matches the legacy SMP baseline.
            smp = 4
            vcpu_maxcpus = 4
