- vfio_net_ops:
    virt_test_type = qemu
    type = vfio_net_boot
    start_vm = no
    # Serial autologin on bash 5.1+ images emits bracketed-paste escapes at the
    # start of the last non-empty line before the prompt; the ^ anchor in the
    # default shell_prompt would never match. Setting a relaxed value here has
    # no effect because the guest-os cfg (loaded later) overrides it. Override
    # in the runtime cfg at a scope that wins, e.g. inside your run variant:
    #     shell_prompt = "\[.*\][\#\$]\s*$"
    shell_prompt = "^\[.*\][\#\$]\s*$"
    # Keep nics empty: the guest must have ONLY the passthrough hostdev(s) as
    # its network interface(s) so that ssh_login_from_mac() picks the VF NIC
    # when matching by MAC. Adding a default NIC here would cause MAC lookup
    # to hit the wrong interface and DHCP races between the two networks.
    nics = ""
    # Host PCI slot of the target PF, e.g. 0000:b8:00.1. Find yours with
    # `lspci -D | grep -i ethernet` and confirm SR-IOV support via
    # `cat /sys/bus/pci/devices/<slot>/sriov_totalvfs`. The slot must be
    # provided in the runtime cfg; there is no meaningful default.
    # setup_hostdev_slots = 0000:00:00.1
    hostdev_bind_driver = vfio-pci
    vm_hostdev_driver = vfio-pci
    hostdev_assignment_type = vf
    # SR-IOV VF pool size to create on the PF. Default covers the two-VF cases;
    # override in runtime cfg if the PF supports fewer VFs.
    hostdev_vf_counts = 4
    # Ping target reachable from the VF subnet. Isolated lab subnets have no
    # external routing; override in runtime cfg with the subnet gateway or
    # another host on the same segment (e.g. ext_host = 192.168.0.1).
    ext_host = kernel.org
    vms = "vm1"
    dma_cmd = "echo 0x200000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit"
    variants:
        - 1vf:
            vm_hostdevs = hostdev1
        - 2vfs:
            vm_hostdevs = "hostdev1 hostdev2"
        - serial_vfs:
            # Handler loops once per available VF, booting a single-hostdev
            # guest each iteration; the iteration count comes from the number
            # of VFs actually created (hostdev_vf_counts).
            vm_hostdevs = hostdev1
            hostdev_serial_vfs = yes
    variants:
        - boot:
            hostdev_action = boot
        - scp:
            hostdev_action = scp
            # Sparse test file size in MiB; matches the legacy 100MiB payload
            # used by the SCP validation.
            scp_file_size_mb = 100
        - hotswap:
            # Iterative hot-unplug/hot-plug of a single VF, mirroring the
            # XVS VTD_HP_09 (ts5.sh tp9) "NIC hot plug reassignment" case.
            # Handler requires exactly one hostdev, so exclude the multi-VF
            # topologies.
            no 2vfs
            no serial_vfs
            hostdev_action = hotswap
            hotplug_iterations = 2
    variants ip_version:
        - ipv4:
    variants:
        # Guest type dimension. "vm" is the standard KVM guest; "tdvm" is
        # the TDX confidential guest, matching XVS tdx_one_vf_smp /
        # tdx_two_vfs_smp / tdx_serial_vfs_smp (SMP TD guest with 1 / 2 /
        # serial VF assignment).
        - vm:
        - tdvm:
            machine_type_extra_params = "kernel-irqchip=split"
            vm_secure_guest_type = tdx
            auto_cpu_model = "no"
            cpu_model = host
            # XVS TDX cases run with cpu=4; keep parity so the leaf
            # geometry matches the legacy SMP baseline.
            smp = 4
            vcpu_maxcpus = 4
