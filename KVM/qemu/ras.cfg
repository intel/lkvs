- ras:
    no Windows
    type = ras
    virt_test_type = qemu
    vm_accelerator = kvm
    start_vm = yes
    kill_vm = yes
    # Default value for centos image, you can overwrite it in runtime cfg for other OS image.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    auto_cpu_model = "no"
    cpu_model = host
    test_dir = '/tmp'
    source_file = 'victim.c'
    exec_file = 'victim'
    variants:
        - srao:
            error_type = "0x10"
