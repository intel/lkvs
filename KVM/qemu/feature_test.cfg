- feature_test:
    type = feature_test
    kill_vm_on_error = yes
    # Default value for centos image, you can overwrite it in runtime cfg for other OS image.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    start_vm = yes
    vga = std
    pip_packages = python3 python3-pip
    test_dir = '/home'
    auto_cpu_model = "no"
    cpu_model = host
    variants:
        - arch_pebs:
            no tdvm
            feature_dir_names = "pmu"
            disable_parallel_run = yes
            pre_command = 'echo 0 > /proc/sys/kernel/nmi_watchdog && modprobe -r kvm_intel && modprobe kvm_intel enable_mediated_pmu=Y'
            post_command = 'echo 1 > /proc/sys/kernel/nmi_watchdog && modprobe -r kvm_intel && modprobe kvm_intel'
            test_scen = "tests-arch_pebs"
        - arch_perfmon_v6:
            no tdvm
            feature_dir_names = "pmu"
            disable_parallel_run = yes
            pre_command = 'echo 0 > /proc/sys/kernel/nmi_watchdog && modprobe -r kvm_intel && modprobe kvm_intel enable_mediated_pmu=Y'
            post_command = 'echo 1 > /proc/sys/kernel/nmi_watchdog && modprobe -r kvm_intel && modprobe kvm_intel'
            test_scen = "tests-arch_perfmon_v6"
        - 3_fix_counters:
            no tdvm
            feature_dir_names = "pmu"
            disable_parallel_run = yes
            pre_command = 'echo 0 > /proc/sys/kernel/nmi_watchdog && modprobe -r kvm_intel && modprobe kvm_intel enable_mediated_pmu=Y'
            post_command = 'echo 1 > /proc/sys/kernel/nmi_watchdog && modprobe -r kvm_intel && modprobe kvm_intel'
            test_scen = "tests-3fix_counters"
        - cmpccxadd:
            feature_dir_names = "cmpccxadd"
        - lam:
            feature_dir_names = "lam"
        - lass:
            feature_dir_names = "lass"
        - umip:
            feature_dir_names = "umip"
        - amx:
            feature_dir_names = "amx"
            cmd_timeout = 500
        - fred:
            feature_dir_names = "fred"
        - nmis:
            feature_dir_names = "nmis"
            no tdvm
        - adaptive_pebs:
            no tdvm
            feature_dir_names = "pmu"
            disable_parallel_run = yes
            pre_command = 'echo 0 > /proc/sys/kernel/nmi_watchdog && modprobe -r kvm_intel && modprobe kvm_intel enable_mediated_pmu=Y'
            post_command = 'echo 1 > /proc/sys/kernel/nmi_watchdog && modprobe -r kvm_intel && modprobe kvm_intel'
            test_scen = "tests-adaptive_pebs"
        - topology_die_cluster_1:
            no tdvm
            feature_dir_names = "topology"
            test_scen = "tests-die_cluster_1"
            mem = 8192
            smp = 192
            vcpu_maxcpus = 192
            vcpu_sockets = 1
            vcpu_dies = 4
            vcpu_cores = 48
            vcpu_threads = 1
            machine_type_extra_params = "smp-cache.0.cache=l2,smp-cache.0.topology=module,kernel-irqchip=split"
            extra_params = "-smp cpus=192,sockets=1,dies=4,modules=24,cores=2,threads=1"
            login_timeout = 600
            cmd_timeout = 300
        - topology_die_cluster_2:
            no tdvm
            feature_dir_names = "topology"
            test_scen = "tests-die_cluster_2"
            mem = 8192
            smp = 192
            vcpu_maxcpus = 192
            vcpu_sockets = 2
            vcpu_dies = 2
            vcpu_cores = 48
            vcpu_threads = 1
            machine_type_extra_params = "smp-cache.0.cache=l2,smp-cache.0.topology=module,kernel-irqchip=split"
            extra_params = "-smp cpus=192,sockets=2,dies=2,modules=24,cores=2,threads=1"
            login_timeout = 600
            cmd_timeout = 300
        - topology_cores_per_socket:
            no tdvm
            feature_dir_names = "topology"
            test_scen = "tests-cores_per_socket"
            mem = 8192
            smp = 192
            vcpu_maxcpus = 192
            vcpu_sockets = 2
            vcpu_dies = 2
            vcpu_cores = 48
            vcpu_threads = 1
            machine_type_extra_params = "smp-cache.0.cache=l2,smp-cache.0.topology=module,kernel-irqchip=split"
            extra_params = "-smp cpus=192,sockets=2,dies=2,modules=24,cores=2,threads=1"
            login_timeout = 600
            cmd_timeout = 300
        - topology_sockets_number:
            no tdvm
            feature_dir_names = "topology"
            test_scen = "tests-sockets_number"
            mem = 8192
            smp = 192
            vcpu_maxcpus = 192
            vcpu_sockets = 2
            vcpu_dies = 2
            vcpu_cores = 48
            vcpu_threads = 1
            backend_mem = memory-backend-ram
            use_mem = no
            mem_devs = "mem0 mem1"
            size_mem0 = 4096M
            size_mem1 = 4096M
            guest_numa_nodes = "node0 node1"
            numa_memdev_node0 = mem-mem0
            numa_memdev_node1 = mem-mem1
            numa_cpus_node0 = "0-95"
            numa_cpus_node1 = "96-191"
            machine_type_extra_params = "smp-cache.0.cache=l2,smp-cache.0.topology=module,kernel-irqchip=split"
            extra_params = "-smp cpus=192,sockets=2,dies=2,modules=24,cores=2,threads=1"
            login_timeout = 600
            cmd_timeout = 300
        - topology_cache_topo:
            no tdvm
            feature_dir_names = "topology"
            test_scen = "tests-cache_topo"
            mem = 8192
            smp = 192
            vcpu_maxcpus = 192
            vcpu_sockets = 1
            vcpu_dies = 4
            vcpu_cores = 48
            vcpu_threads = 1
            machine_type_extra_params = "smp-cache.0.cache=l2,smp-cache.0.topology=module,kernel-irqchip=split"
            extra_params = "-smp cpus=192,sockets=1,dies=4,modules=24,cores=2,threads=1"
            login_timeout = 600
            cmd_timeout = 300
    variants:
        - vm:
        - tdvm:
            machine_type_extra_params = "kernel-irqchip=split"
            vm_secure_guest_type = tdx
