- vfio_net_boot:
    virt_test_type = qemu
    type = vfio_net_boot
    start_vm = no
    # Default matches the CentOS/RHEL guest-os cfg shell_prompt.
    #
    # NOTE: this case uses wait_for_serial_login() (nics is empty, so SSH
    # via a management NIC is not available). Serial autologin on bash 5.1+
    # images emits bracketed-paste escapes (\x1b[?2004l\x1b[?2004h) at the
    # start of the last non-empty line before the prompt, and the ^ anchor
    # will never match. Setting a relaxed value here has no effect because
    # the guest-os RHEL/CentOS cfg (loaded later in cartesian resolution)
    # overrides it. You MUST override in the runtime cfg at a scope that
    # wins, e.g. inside the run_test variant:
    #     shell_prompt = "\[.*\][\#\$]\s*$"
    shell_prompt = "^\[.*\][\#\$]\s*$"
    # Keep nics empty: the guest must have ONLY the passthrough hostdev as its
    # network interface so that ssh_login_from_mac() picks the VF/PF NIC when
    # matching by MAC. Adding a default NIC here would cause MAC lookup to hit
    # the wrong interface and DHCP races between the two networks.
    nics = ""
    # Host PCI slot of the target PF, e.g. 0000:b8:00.1. Find yours with
    # `lspci -D | grep -i ethernet` and confirm SR-IOV support via
    # `cat /sys/bus/pci/devices/<slot>/sriov_totalvfs`. The slot must be
    # provided in the runtime cfg; there is no meaningful default.
    # setup_hostdev_slots = 0000:00:00.1
    hostdev_bind_driver = vfio-pci
    vm_hostdev_driver = vfio-pci
    # Ping target reachable from the PF/VF subnet. kernel.org works only when
    # the passthrough NIC is on a network with external routing. On isolated
    # lab subnets, override in the runtime cfg with e.g. the subnet gateway
    # or another host on the same segment (e.g. ext_host = 192.168.0.1).
    ext_host = kernel.org
    vms = "vm1"
    vm_hostdevs = hostdev1
    variants:
        - pf:
            hostdev_assignment_type = pf
        - vf:
            hostdev_assignment_type = vf
            hostdev_vf_counts = 4
    variants ip_version:
        - ipv4:
    variants:
        - @default:
            dma_cmd = "echo 0x200000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit"
        - iommufd:
            vm_hostdev_iommufd = iommufd0
    variants:
        - @default:
        - virtio_iommu:
            required_qemu= [7.0.0,)
            only x86_64
            only q35
            enable_guest_iommu = yes
            virtio_iommu = yes
    variants:
        - vm:
        - tdvm:
            vm_secure_guest_type = tdx
            machine_type_extra_params = "kernel-irqchip=split"
            auto_cpu_model = "no"
            cpu_model = "host"
