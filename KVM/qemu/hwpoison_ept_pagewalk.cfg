- hwpoison_ept_pagewalk:
    type = hwpoison_ept_pagewalk
    virt_test_type = qemu
    vm_accelerator = kvm
    only Linux
    start_vm = no
    # The test owns cleanup before injection.  After EINJ, keep a surviving
    # QEMU untouched for investigation; normal PASS requires it to exit.
    kill_vm = no
    auto_cpu_model = no
    cpu_model = host
    shell_prompt = "^\[.*\][\#\$]\s*$"

    # Dedicated host only.  Refuses to reload KVM while any process holds
    # /dev/kvm.  Run with prepare_host=no if the host was prepared manually.
    prepare_host = yes
    # First run with perform_injection=no to verify GPA/SPTE/address selection.
    perform_injection = yes
    guest_test_dir = /tmp
    expected_mcacod = 0x1a4
    einj_mask = 0xffffffffffffffff
    event_timeout = 45
    host_survival_seconds = 5
