- ptvmx:
    virt_test_type = qemu
    vm_accelerator = kvm
    # Default value for centos image, you can overwrite it in runtime cfg for other OS image.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    vga = std
    auto_cpu_model = "no"
    cpu_model = host
    kill_vm_on_error = yes
    # Keep host warnings such as the pt.mediated hint in debug/host_dmesg.log.
    host_dmesg_level = 5
    host_dmesg_ignore = yes
    check_host_cpuid = yes
    test_dir = '/home'
    source_file = 'cpuid_check.c'
    exec_file = 'cpuid_check'
    # Intel PT: CPUID.07H.00H:EBX[25] = 1
    cpuid = "7 0 0 0 b 25"
    only i386, x86_64
    # Host side Intel PT virtualization switches, overridden per variant.
    # Intel PT virtualization is only armed when the mediated PMU is enabled
    # together with pt_mode, so both knobs are kept in sync per variant.
    #
    # The host must boot with pt.mediated=1 to test Intel PT virtualization.
    pt_mode = 1
    pmu_mode = Y
    ept_mode = Y
    variants:
        # Intel PT is exposed to guest when host runs with pt_mode=1
        - pt_sanity:
            type = x86_cpuid
            start_vm = no
        # Intel PT must disappear from guest when host runs with pt_mode=0
        - pt_disabled:
            type = x86_cpuid
            start_vm = no
            pt_mode = 0
            pmu_mode = N
            no_cpuid = "7 0 0 0 b 25"
        # Intel PT must not be exposed to guest when EPT is turned off
        - pt_no_ept:
            type = x86_cpuid
            start_vm = no
            ept_mode = N
            pmu_mode = N
            no_cpuid = "7 0 0 0 b 25"
        # Intel PT survives guest state save and restore
        - pt_sr:
            type = vm_save_restore
            start_vm = no
            image_snapshot = yes
            smp = 4
            vcpu_maxcpus = 4
            sr_iterations = 1
            sr_check = cpu_num
            sr_timeout = 600
            login_timeout = 360
        # Intel PT survives guest live migration
        - pt_lm:
            type = live_migration_verify
            start_vm = yes
            image_snapshot = no
            smp = 4
            vcpu_maxcpus = 4
            verify_target = cpu_num
            migration_protocol = tcp
            mig_timeout = 300
            login_timeout = 360
    variants:
        - vm:
    # Keep pre_command below the variants blocks. Cartesian config expands
    # ${var} at assignment time, so a definition placed above would always
    # pick up the defaults instead of the per variant overrides.
    pre_command = '{ grep -qx Y /sys/module/pt/parameters/mediated 2>/dev/null || { echo "pt.mediated is not Y, add pt.mediated=1 to host kernel cmdline, or check host kernel supports Intel PT mediated mode" >&2; false; }; }'
    pre_command += ' && echo 0 > /proc/sys/kernel/nmi_watchdog && modprobe -r kvm_intel && modprobe kvm_intel pt_mode=${pt_mode} ept=${ept_mode} enable_mediated_pmu=${pmu_mode}'
    pre_command += ' && if [ ${pmu_mode} = Y ]; then grep -qx Y /sys/module/kvm_intel/parameters/enable_mediated_pmu || { echo "enable_mediated_pmu is not Y, cannot test ptvmx" >&2; false; }; fi'
    pre_command += ' && if [ ${pmu_mode} = Y ]; then grep -qx 1 /sys/module/kvm_intel/parameters/pt_mode || { echo "pt_mode is not 1, check host EPT and VMX Intel PT support" >&2; false; }; fi'
    post_command = 'echo 1 > /proc/sys/kernel/nmi_watchdog && modprobe -r kvm_intel && modprobe kvm_intel'
