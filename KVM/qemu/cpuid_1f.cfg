- cpuid_1f:
    type = cpuid_1f
    kill_vm_on_error = yes
    start_vm = no
    auto_cpu_model = "no"
    cpu_model = host
    shell_prompt = "^\[.*\][\#\$]\s*$"
    vga = std
    test_dir = '/home'
    source_file = 'cpuid_1f_check.c'
    exec_file = 'cpuid_1f_check'
    smp = 8
    variants:
        - host:
            host_only = yes
        - srf:
            cpu_model = SierraForest-v6
            cpu_model_flags = ",pmu=off"
            vcpu_sockets = 2
            vcpu_dies = 2
            vcpu_cores = 2
            vcpu_threads = 1
        - gnr:
            cpu_model = GraniteRapids-v7
            cpu_model_flags = ",pmu=off"
            vcpu_sockets = 2
            vcpu_dies = 2
            vcpu_cores = 2
            vcpu_threads = 1
        - spr:
            cpu_model = SapphireRapids-v8
            cpu_model_flags = ",pmu=off"
            vcpu_sockets = 2
            vcpu_dies = 2
            vcpu_cores = 2
            vcpu_threads = 1
