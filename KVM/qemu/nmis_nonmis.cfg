- nmis_nonmis:
    type = nmis_nonmis
    kill_vm_on_error = yes
    start_vm = no
    auto_cpu_model = "no"
    cpu_model = host
    cpu_model_flags = ",-nmi-source"
    shell_prompt = "^\[.*\][\#\$]\s*$"
    vga = std
    test_dir = '/home'
    source_file = cpuid_check.c
    exec_file = cpuid_check
    fred_cpuid = 7 0 1 0 a 17
    cpuid = 7 0 1 0 a 20
