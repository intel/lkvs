- @:
    variants:
        - buslock_de:
            type = buslock_de
            only Linux
            virt_test_type = qemu
            vm_accelerator = kvm
            start_vm = yes
            kill_vm = yes
            # Default value for centos image, you can overwrite it in runtime cfg for other OS image.
            shell_prompt = "^\[.*\][\#\$]\s*$"
            auto_cpu_model = "no"
            cpu_model = host
            vga = std
            test_dir = '/tmp'
            reboot_settle_time = 20
            cmdline_check_retry = 3
            cmdline_check_retry_sleep = 5
            cpuid_src_subdir = tools/cpuid_check
            cpuid_source_file = 'cpuid_check.c'
            cpuid_exec_file = 'cpuid_check'
            cpuid = "7 0 0 0 c 24"
            deps_subdir = "bus_lock"
            bus_lock_source_file = bus_lock.c
            bus_lock_exec_file = bus_lock.out
            bus_lock_common_file = bus_lock_common.h
            variants:
                - buslock_de_warn:
                    split_lock_mode = warn
                    expected_msr_bit = 1
                    expected_dmesg_delta = ge1
                    check_core_dump = yes
                    expect_exception_nmi = yes
                - buslock_de_off:
                    split_lock_mode = off
                    expected_msr_bit = 0
                    expected_dmesg_delta = zero
                    expect_exception_nmi = no
                - buslock_de_fatal:
                    split_lock_mode = fatal
                    expected_msr_bit = 1
                    expected_dmesg_delta = zero
                    expect_bus_error = yes
                    expect_exception_nmi = yes
                - buslock_de_ratelimit:
                    split_lock_mode = ratelimit:5
                    bus_lock_source_file = bus_lock_10.c
                    bus_lock_exec_file = bus_lock_10.out
                    expected_msr_bit = 1
                    expected_dmesg_delta = exact
                    expected_dmesg_count = 5
                    expect_exception_nmi = yes
                    ratelimit_retry = yes
            variants:
                - vm:
                - td:
                    machine_type_extra_params = "kernel-irqchip=split"
                    vm_secure_guest_type = tdx
                    bus_lock_source_file_tdx = bus_lock_64.c
                    bus_lock_exec_file_tdx = bus_lock_64.out

        - tdx_ac_handle:
            type = buslock_de
            buslock_de_action = tdx_ac_handle
            only Linux
            virt_test_type = qemu
            vm_accelerator = kvm
            machine_type_extra_params = "kernel-irqchip=split"
            vm_secure_guest_type = tdx
            start_vm = yes
            kill_vm = yes
            shell_prompt = "^\[.*\][\#\$]\s*$"
            auto_cpu_model = "no"
            cpu_model = host
            test_dir = "/tmp"
            deps_subdir = "bus_lock"
            bus_lock_source_file = "bus_lock_64.c"
            bus_lock_exec_file = "bus_lock_64.out"
            bus_lock_common_file = "bus_lock_common.h"
            trigger_delay = 2
            trigger_timeout = 30
            guest_recovery_timeout = 30
            dmesg_settle_time = 2
            ac_log_pattern = "split lock detection: #AC"
            ac_failure_pattern = "Call Trace:|Oops:|BUG:|Split lock detected"
