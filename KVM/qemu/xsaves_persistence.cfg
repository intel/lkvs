- xsaves_persistence:
    type = xsaves_persistence
    only Linux
    virt_test_type = qemu
    vm_accelerator = kvm
    start_vm = no
    kill_vm = yes
    # Default value for centos image; runtime cfg may override.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    auto_cpu_model = "no"
    cpu_model = host
    login_timeout = 240
    deps_subdir = "xsaves_workload"
    guest_workdir = "/root/xsaves_workload"
    xsaves_flag = "xsaves"
    workload_packages = "gcc make"
    nbench_tarball = "nbench-byte-2.2.3.tar.gz"
    nbench_extracted_dir = "nbench-byte-2.2.3"
    nbench_max_runtime_seconds = 60
    nbench_min_result_lines = 1
    variants:
        - sr:
            # Save the running guest to a file (exec:cat migration), then
            # restore. XSAVES must survive the round-trip and nbench must
            # still complete FP work post-restore.
            persistence_mode = "sr"
            save_file = "/tmp/xsaves_persistence_save.img"
        - lm:
            # Local live migration to a new QEMU instance on the same host.
            # XSAVES must remain visible in the destination and nbench must
            # still complete FP work after the migration.
            persistence_mode = "lm"
            mig_protocol = "tcp"
            mig_timeout = 300
