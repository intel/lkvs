- virt_interrupt:
    type = virt_interrupt
    virt_test_type = qemu
    vm_accelerator = kvm
    force_create_image = no
    remove_image = no
    image_snapshot = yes
    start_vm = no
    kill_vm = yes
    shell_prompt = "^\[.*\][\#\$]\s*$"
    vga = std
    perf_event = "kvm:kvm_inj_virq"
    perf_duration = 10
