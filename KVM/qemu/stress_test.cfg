- stress_test:
    type = stress_test
    virt_test_type = qemu
    vm_accelerator = kvm
    force_create_image = no
    remove_image = no
    image_snapshot = yes
    start_vm = no
    kill_vm = yes
    shell_prompt = "^\[.*\][\#\$]\s*$"
    vga = std
    smp = 8
    mem = 8192
    stress_cpu = 8
    stress_vm_workers = 8
    stress_vm_bytes = "1024M"
    stress_io = 1
    stress_hdd = 1
    stress_hdd_bytes = "3G"
    stress_timeout = 60
    stress_tool = "stress-ng"
