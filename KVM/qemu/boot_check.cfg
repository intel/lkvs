- boot_check:
    type = boot_check
    virt_test_type = qemu
    vm_accelerator = kvm
    start_vm = no
    # Stop VM after testing
    kill_vm = yes
    # Default value for centos image, you can overwrite it in runtime cfg for other OS image.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    vga = std
    variants:
        - 1_cpu:
            smp = 1
        - 2_cpu:
            smp = 2
        - 4_cpu:
            smp = 4
        - 8_cpu:
            smp = 8
        - 16_cpu:
            smp = 16
        - 208_cpu:
            smp = 208
        - 256_cpu:
            smp = 256
        - 288_cpu:
            only q35
            machine_type_extra_params = "kernel-irqchip=split"
            smp = 288
    variants:
        - 1G:
            no 208_cpu, 256_cpu, 288_cpu
            mem = 1024
        - 2031M:
            # 2031 is not aligned to the guest memory block size, so the
            # in-guest total memory can not match it exactly. Only require
            # the guest to boot up successfully with this memory size.
            only 1_cpu
            mem = 2031
            check_mem = no
        - 4G:
            mem = 4096
        - 16G:
            mem = 16384
        - max_mem:
            is_max_mem = yes
        - low_mem_nxhp:
            no tdvm
            only 2_cpu
            nxhp_conf = "/sys/module/kvm/parameters/nx_huge_pages"
            is_nxhp = yes
            is_low_mem_nxhp = yes
        - high_mem_nxhp:
            no tdvm
            only 2_cpu
            nxhp_conf = "/sys/module/kvm/parameters/nx_huge_pages"
            is_nxhp = yes
            is_high_mem_nxhp = yes
    variants:
        - vm:
        - tdvm:
            machine_type_extra_params = "kernel-irqchip=split"
            vm_secure_guest_type = tdx
            auto_cpu_model = "no"
            cpu_model = host
