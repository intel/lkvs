- tdx_numa_set:
    type = boot_check
    virt_test_type = qemu
    vm_accelerator = kvm
    machine_type_extra_params = "kernel-irqchip=split"
    vm_secure_guest_type = tdx
    start_vm = no
    kill_vm = yes
    # Default value for centos image, you can overwrite it in runtime cfg for other OS image.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    vga = std
    auto_cpu_model = "no"
    cpu_model = host
    smp = 4
    mem = 4096
    mem_devs = "mem0"
    use_mem_mem0 = "no"
    size_mem_mem0 = 4096M
    backend_mem_mem0 = memory-backend-ram
    prealloc_mem_mem0 = yes
    guest_numa_nodes = "node0"
    numa_memdev_node0 = mem-mem0
    numa_cpus_node0 = "0-3"
    numa_nodeid_node0 = 0
