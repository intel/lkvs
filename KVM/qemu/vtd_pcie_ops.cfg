- vtd_pcie_ops:
    virt_test_type = qemu
    type = vfio_net_boot
    start_vm = no
    shell_prompt = "^\[.*\][\#\$]\s*$"
    nics = ""
    # setup_hostdev_slots = 0000:00:00.1
    hostdev_bind_driver = vfio-pci
    vm_hostdev_driver = vfio-pci
    # PF passthrough of a whole NIC; the
    # target slot must be provided via setup_hostdev_slots in the runtime
    # cfg. No SR-IOV VFs are created for these cases.
    hostdev_assignment_type = pf
    # Verify through the serial console only: the guest has no management
    # NIC (nics=""), so host-to-guest SSH is not reachable. We drive
    # ping and the MSI/IO-APIC interrupt-class check inside the guest via
    # the serial channel, without touching lab net.
    hostdev_verify_mode = serial
    ext_host = kernel.org
    vms = "vm1"
    vm_hostdevs = hostdev1
    variants ip_version:
        - ipv4:
    variants:
        - one_pcie_smp_q35:
            hostdev_action = boot
            only q35
            smp = 4
            vcpu_maxcpus = 4
        - one_pcie_smp_nomsi:
            hostdev_action = boot
            smp = 4
            vcpu_maxcpus = 4
            disable_pci_msi = yes
        - vtd_ras_hs:
            hostdev_action = hotswap
            hotplug_iterations = 2
            smp = 4
            vcpu_maxcpus = 4
        - tdx_vtd_ras_hs:
            # TDX variant of vtd_ras_hs (NIC hot-plug reassignment under a
            # TD guest).
            hostdev_action = hotswap
            hotplug_iterations = 2
            smp = 4
            vcpu_maxcpus = 4
            machine_type_extra_params = "kernel-irqchip=split"
            vm_secure_guest_type = tdx
            auto_cpu_model = "no"
            cpu_model = host
            # TDX guests still need a raised vfio_iommu_type1 dma_entry_limit
            # for large-memory VMs; PF passthrough uses a single mapping
            # region but the default limit is too low on some kernels.
            dma_cmd = "echo 0x200000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit"
        - hp_pcie_smp:
            # Hot-plug reassignment of a whole PF NIC against a 4-vCPU SMP
            # guest: boot with the NIC cold-plugged, hot-unplug to a
            # baseline, then iteratively hot-plug/unplug and verify guest
            # connectivity across the cycles. The NIC is left unplugged
            # on teardown.
            hostdev_action = hotswap
            hotplug_iterations = 2
            smp = 4
            vcpu_maxcpus = 4
        - lm_pcie_smp:
            # Local live migration of a 4-vCPU SMP guest that owns a whole
            # PF NIC. PCI passthrough blocks migration, so the handler
            # hot-unplugs the NIC before vm.migrate(), confirms the guest
            # survives on the destination via serial, re-attaches the NIC
            # and re-verifies it, then hot-unplugs it again so no device is
            # left plugged in on teardown.
            hostdev_action = live_migration
            mig_protocol = tcp
            mig_timeout = 300
            smp = 4
            vcpu_maxcpus = 4
