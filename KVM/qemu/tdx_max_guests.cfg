- tdx_max_guests:
    virt_test_type = qemu
    type = tdx_max_guests
    vm_accelerator = kvm
    machine_type_extra_params = "kernel-irqchip=split"
    vm_secure_guest_type = tdx
    image_snapshot = yes
    start_vm = no
    # Default value for centos image, you can overwrite it in runtime cfg for other OS image.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    vga = std
    auto_cpu_model = "no"
    cpu_model = host
    msr_pkg = "msr-tools"
    rdmsr_cmd = "rdmsr 0x00000087"
    variants:
        - max:
        - max_20times:
            # Boot stress: boot the maximum number of TDs, log into each,
            # force-destroy all of them, and repeat.
            cycles = 20
            destroy_gracefully = no
            test_timeout = 21600
        - out_max:
            overrange_tdx_kids = "yes"
            xfail = "yes"
