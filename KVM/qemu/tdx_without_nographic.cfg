- tdx_without_nographic:
    type = tdx_without_nographic
    virt_test_type = qemu
    machine_type_extra_params = "kernel-irqchip=split"
    vm_secure_guest_type = tdx
    start_vm = no
    # Stop VM after testing
    kill_vm = yes
    # Default value for centos image, you can overwrite it in runtime cfg for other OS image.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    auto_cpu_model = "no"
    cpu_model = host
    guest_flags = "tdx_guest"
    # Comment all `display` parameters in tdx_temp.cfg and change this
    # parameter among (vnc, sdl, spice) according to your machine config
    display = "vnc"
