- smp:
    no Windows
    type = smp
    virt_test_type = qemu
    vm_accelerator = kvm
    start_vm = yes
    kill_vm = yes
    # Default value for centos image, you can overwrite it in runtime cfg for other OS image.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    auto_cpu_model = "no"
    cpu_model = host
    variants:
        - cpuinfo_chk:
            test_tool = cpuinfo_chk.c
        - mem_coh:
            test_tool = mem_coh.c
        - affinity_getting:
            test_tool = affinity_getting.c
        - affinity_setting:
            test_tool = affinity_setting.c
        - affinity_inherit:
            test_tool = affinity_inherit.c
    variants:
        - vm:
        - tdvm:
            machine_type_extra_params = "kernel-irqchip=split"
            vm_secure_guest_type = tdx
