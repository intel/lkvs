- vfio_net_disable:
    virt_test_type = qemu
    type = vfio_net_disable
    start_vm = no
    # Serial autologin on bash 5.1+ images emits bracketed-paste escapes before
    # the prompt; the default anchored regex never matches. Override in the
    # runtime cfg at a scope that wins over guest-os.cfg (e.g. inside the
    # run variant).
    shell_prompt = "^\[.*\][\#\$]\s*$"
    # Keep nics empty so the guest only has the passthrough VF as its NIC;
    # ssh_login_from_mac() matches the VF MAC without hitting a bridge NIC.
    nics = ""
    # Host PCI slot of the target PF (e.g. 0000:b8:00.1). Must be supplied
    # by the runtime cfg; there is no meaningful default here.
    # setup_hostdev_slots = 0000:00:00.1
    hostdev_bind_driver = vfio-pci
    vm_hostdev_driver = vfio-pci
    hostdev_assignment_type = vf
    # SR-IOV VF pool size to create on the PF; 4 matches the other vfio_net
    # cases and gives the second-phase guest a fresh VF after the first
    # phase's violent teardown.
    hostdev_vf_counts = 4
    # Ping target reachable from the VF subnet. Isolated lab subnets have no
    # external routing; override in the runtime cfg to a reachable host
    # (e.g. the subnet gateway).
    ext_host = kernel.org
    vms = "vm1"
    # Only one VF is assigned per guest; the whole point is to disable that
    # very VF from under the running guest.
    vm_hostdevs = "hostdev1"
    dma_cmd = "echo 0x200000 > /sys/module/vfio_iommu_type1/parameters/dma_entry_limit"
    variants ip_version:
        - ipv4:
    variants:
        # Guest type dimension. Only the standard VM variant is exercised here;
        # a tdvm branch can be added later on a TDX-capable host with the
        # usual TDX cfg (vm_secure_guest_type = tdx,
        # machine_type_extra_params = "kernel-irqchip=split", pinned cpu_model).
        - vm:
