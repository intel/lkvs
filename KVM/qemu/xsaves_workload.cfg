- xsaves_workload:
    type = xsaves_workload
    only Linux
    virt_test_type = qemu
    vm_accelerator = kvm
    start_vm = no
    kill_vm = yes
    # Default value for centos image; runtime cfg may override.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    auto_cpu_model = "no"
    cpu_model = host
    login_timeout = 240
    # Deps directory under KVM/qemu/deps/ (resolved via data_dir.get_deps_dir).
    deps_subdir = "xsaves_workload"
    guest_workdir = "/root/xsaves_workload"
    xsaves_flag = "xsaves"
    # Guest packages needed to build the payloads.
    workload_packages = "gcc make"
    variants:
        - vz:
            # SSE + vzeroupper interaction. Compiles two variants of the same
            # source with and without -DVZ, runs both, and asserts each
            # completes within a sane multiple of the other.
            workload_type = "vz"
            vz_source_file = "vz_novz_performance.c"
            vz_max_runtime_seconds = 30
            vz_ratio_limit = 4
        - security:
            # Corrupts the sigcontext fpstate pointer and expects the kernel
            # to kill the process AND emit a "bad frame" diagnostic.
            workload_type = "security"
            security_source_file = "security.c"
            security_dmesg_pattern = "bad frame"
        - nbench:
            # Full nbench numeric benchmark suite. Build must succeed and
            # the benchmark must produce at least a few completed results
            # within the bounded run window.
            workload_type = "nbench"
            nbench_url = "https://www.math.utah.edu/~mayer/linux/nbench-byte-2.2.3.tar.gz"
            nbench_tarball = "nbench-byte-2.2.3.tar.gz"
            nbench_extracted_dir = "nbench-byte-2.2.3"
            nbench_max_runtime_seconds = 180
            nbench_min_result_lines = 2
            workload_packages = "gcc make wget"
