- cpu_pku:
    type = cpu_pku
    only i386 x86_64
    no RHEL.6 RHEL.7 RHEL.8.0 RHEL.8.1 RHEL.8.2 RHEL.8.3 RHEL.8.4 RHEL.8.5 RHEL.8.6
    start_vm = no
    # Default value for centos image, you can overwrite it in runtime cfg for other OS image.
    shell_prompt = "^\[.*\][\#\$]\s*$"
    image_snapshot = yes
    timeout = 120
    unsupported_models = "EPYC-Rome EPYC EPYC-IBPB Opteron_G5 Opteron_G4 Opteron_G3 Opteron_G2 Opteron_G1"
    guest_dir = '/home/pku_test/'
    deps_subdir = cpu_pku
    compile_cmd = gcc -Wall -O2 -I . -Wunreachable-code -U_FORTIFY_SOURCE -no-pie -mxsave -include pkey_compat.h protection_keys.c pkey_util.c mm/hugepage_settings.c mm/file_utils.c -lrt -lpthread -lm -ldl -o protection_keys
    run_cmd = ./protection_keys
    variants:
        - vm:
        - tdvm:
            machine_type_extra_params = "kernel-irqchip=split"
            vm_secure_guest_type = tdx
            auto_cpu_model = "no"
            cpu_model = host
